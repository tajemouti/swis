services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: swis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swis_user
      POSTGRES_PASSWORD: swis_password
      POSTGRES_DB: swis_db
    ports:
      - '5433:5432'
    volumes:
      - swis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swis_user -d swis_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swis-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - swis_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swis_postgres_data:
  swis_redis_data:
